services:
  - type: web
    name: shukarsh-backend
    runtime: node
    repo: https://github.com/iamlordutkarsh/shukarsh-backend
    branch: main
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: product-images
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: SHIPROCKET_PICKUP_PINCODE
        sync: false
      - key: SHIPROCKET_CHANNEL_ID
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN
        generateValue: true
      # Cash on delivery is on unless COD_ENABLED is the string "false", which is
      # the switch to reach for during a week nobody can chase parcels.
      - key: COD_ENABLED
        sync: false
      - key: COD_FEE
        sync: false
      - key: COD_MAX
        sync: false
